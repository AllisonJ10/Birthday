<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Invitación de Cumpleaños</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#0b0f1a" />
</head>
<body>
  <main class="layout">
    <!-- Área del video (ocupa todo el alto menos la barra de botones) -->
    <section class="video-wrap">
      <video
        id="videoHero"
        class="video-fit"
        src="assets/video.mp4"
        poster="assets/poster.jpg"
        playsinline
        muted
        autoplay
        loop
        controls
        preload="metadata"
      >
        <!-- Si prefieres un video alojado en Internet, comenta la línea 'src' y usa esto:
        <source src="https://tu-cdn.com/ruta/video.mp4" type="video/mp4" />
        -->
        Tu navegador no soporta video HTML5.
      </video>
    </section>

    <!-- Barra de botones fija al final -->
    <nav class="cta-bar" role="navigation" aria-label="Acciones">
      <a
        class="btn btn-whatsapp"
        href="https://wa.me/51979463448?text=%C2%A1Hola!%20Confirmo%20mi%20asistencia%20al%20cumplea%C3%B1os.%20%F0%9F%8E%89"
        target="_blank" rel="noopener"
      >
        Confirmar asistencia
      </a>
      <a
        class="btn btn-maps"
        href="https://maps.app.goo.gl/HhFdvARmdAQkyEcp8"
        target="_blank" rel="noopener"
      >
        Ver ubicación
      </a>
    </nav>
  </main>
</body>
</html>
